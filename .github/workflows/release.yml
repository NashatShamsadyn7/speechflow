name: Build & Release SpeechFlow

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test SpeechFlow.slnx -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '3.0.0' }
          "value=$v" >> $env:GITHUB_OUTPUT

      # The app itself: one self-contained exe, no .NET install needed on the user's PC.
      - name: Publish
        run: >
          dotnet publish src/SpeechFlow/SpeechFlow.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          iscc /DAppVersion=${{ steps.version.outputs.value }} installer\SpeechFlow.iss

      - name: Portable copy
        shell: pwsh
        run: Copy-Item publish\SpeechFlow.exe "dist\SpeechFlow-Portable-${{ steps.version.outputs.value }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeechFlow-${{ steps.version.outputs.value }}
          path: dist/*.exe

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
